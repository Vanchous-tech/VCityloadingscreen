    <style>
    /*
    * K-Load v2 - Custom V-City Edition
    */

    *, *:before, *:after {
        -webkit-box-sizing: inherit;
        box-sizing: inherit;
    }

    html {
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        font-family: 'Raleway', sans-serif;
        font-weight: 300;
        color: #fff;
        background-color: #0c0d10;
        margin: 0 !important;
        user-select: none;
        -webkit-user-select: none;
    }

    body:before {
        z-index: -999999;
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    /* Фоновые вертикальные полосы и затемнение (Overlay из K-Load) */
    .overlay, .overlay:before {
        z-index: -99999;
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
    }

    .overlay:before {
        content: '';
    }

    .overlay {
        background-color: rgba(0, 0, 0, 0.45);
    }

    .overlay.vertical {
        background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAMAAAADCAYAAABWKLW/AAAAEklEQVQImWNgQID/TEgcBhQOABtaAQQflFz/AAAAAElFTkSuQmCC');
    }

    /* Центральный блок */
    .pure-center {
        position: fixed;
        top: 50%;
        left: 50%;
        -webkit-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Оранжевый круговой индикатор загрузки */
    #load-circle {
        position: relative;
        width: 180px;
        height: 180px;
        background-color: rgba(22, 23, 27, 0.85);
        border: 3px solid rgba(255, 255, 255, 0.22);
        border-radius: 50%;
        overflow: hidden !important;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.65),
                    inset 0 0 20px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        margin-bottom: 16px;
    }

    #load-circle-inner {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        width: 180px;
        height: 180px;
        clip: rect(180px 180px 180px 0);
        -webkit-transition: clip 0.25s linear;
        transition: clip 0.25s linear;
        fill: #ff6300;
        filter: drop-shadow(0 0 8px rgba(255, 99, 0, 0.6));
    }

    /* Метка "Игрок" */
    .player-tag {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        color: #ff6300;
        font-weight: 600;
        margin-bottom: 2px;
        text-shadow: 0 2px 8px rgba(255, 99, 0, 0.4);
    }

    /* Название сервера V-City */
    .server-name {
        font-size: 2.6rem;
        font-weight: 700;
        letter-spacing: 1px;
        margin: 2px 0 8px 0;
        color: #ffffff;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9),
                     0 1px 3px rgba(0, 0, 0, 0.8);
    }

    /* Подпись "Это бета-тест..." */
    .messages {
        opacity: 1;
        -webkit-transition: opacity 1s ease;
        transition: opacity 1s ease;
        font-size: 1.15rem;
        color: #cfd2de;
        display: inline-block;
        max-width: 650px;
        line-height: 1.4;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    /* Боковые плашки */
    .fixed {
        position: fixed;
    }
    .fixed.left {
        left: 0;
    }
    .fixed.right {
        right: 0;
    }
    .fixed.bottom {
        bottom: 0;
    }
    .fixed.vertical-center {
        top: 50%;
        -webkit-transform: translateY(-50%);
        transform: translateY(-50%);
    }

    .sidebar {
        width: 140px;
        height: 140px;
        vertical-align: middle;
        background-color: rgba(26, 26, 26, 0.95);
        border-top: 5px solid rgba(255, 255, 255, 0.3);
        border-bottom: 5px solid rgba(255, 255, 255, 0.3);
        z-index: 20;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .sidebar.left {
        padding-right: 10px;
        border-right: 5px solid rgba(255, 255, 255, 0.3);
        border-radius: 0 50% 50% 0;
    }

    .sidebar.right {
        padding-left: 10px;
        border-left: 5px solid rgba(255, 255, 255, 0.3);
        border-radius: 50% 0 0 50%;
    }

    /* Левая плашка: Куратор */
    .k-load-staff-block {
        display: none;
        opacity: 0;
        -webkit-transition: opacity 1s ease;
        transition: opacity 1s ease;
        margin-top: 15px;
    }

    .k-load-staff-block.active {
        opacity: 1;
    }

    .k-load-staff {
        text-align: center;
    }

    .k-load-staff .avatar {

        width: 50px;
        height: 50px;

    .k-load-staff--rank {

    }

    .sidebar > .percentage {

        font-weight: 300;

    /* ========================================================
       ВИДЖЕТ МУЗЫКИ: ИНДИКАТОР ПЛЕЙЛИСТА ИЗ 5 ПЕСЕН
       ======================================================== */
    .music-container {
        display: none;
        position: fixed;
        bottom: 24px;
        left: 24px;
        z-index: 30;
    }

    .music-card {
        position: relative;

        gap: 12px;
        padding: 10px 18px 12px 18px;
        background: rgba(22, 23, 27, 0.94);
        border: 2px solid rgba(255, 255, 255, 0.22);
        border-radius: 32px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        overflow: hidden;
        transition: all 0.2s ease;
    }

    /* Тонкая линия прогресса воспроизведения трека */
    .music-progress-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
    }

    .music-progress-fill {
        height: 100%;
        width: 0%;
        background: #ff6300;
        transition: width 0.2s linear;
        box-shadow: 0 0 6px rgba(255, 99, 0, 0.8);
    }

    /* Анимированный эквалайзер */
    .music-eq {
        display: flex;
        align-items: flex-end;
        gap: 2.5px;
        height: 16px;
        width: 15px;
    }

    .music-eq span {
        width: 3px;
        background-color: #ff6300;
        border-radius: 2px;
        height: 4px;
        transition: height 0.15s ease;
    }

    .music-card.playing .music-eq span:nth-child(1) {
        animation: eq-bounce 0.8s ease-in-out infinite alternate;
    }
    .music-card.playing .music-eq span:nth-child(2) {
        animation: eq-bounce 1.1s ease-in-out 0.2s infinite alternate;
    }
    .music-card.playing .music-eq span:nth-child(3) {
        animation: eq-bounce 0.9s ease-in-out 0.4s infinite alternate;
    }
    .music-card.playing .music-eq span:nth-child(4) {
        animation: eq-bounce 1.2s ease-in-out 0.1s infinite alternate;
    }

    @keyframes eq-bounce {
        0% { height: 3px; }
        50% { height: 16px; }
        100% { height: 6px; }
    }

    .music-text {
        display: flex;
        flex-direction: column;
        gap: 1px;
    }

    .music-top-line {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .music-label {
        font-size: 10px;
        text-transform: uppercase;

        letter-spacing: 0.5px;

    .music-track-counter {

    .music-controls {

    .music-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #fff;
        width: 28px;
        height: 28px;

        align-items: center;

        cursor: pointer;

    .music-btn:hover {

        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
    }
    .demo-bar button:hover {
        background: rgba(255, 255, 255, 0.25);
    }
    </style>

<!-- ========================================================
     ДВИЖОК K-LOAD И ОБРАБОТЧИКИ GMOD
     ======================================================== -->
<script type="text/javascript">
    const elem = function (tag, attrs, children) {
        const elem = document.createElement(tag);
        Object.keys(attrs).forEach(function (key) {
            if (key in document.createElement(tag)) {
                elem[key] = attrs[key];
            } else {
                elem.setAttribute(key, attrs[key]);
            }
        });
        if (Array.isArray(children)) {
            children.forEach(function (child) {
                if (typeof child === "string") {
                    child = document.createTextNode(child);
                }
                elem.appendChild(child);
            });
        }
        return elem;
    };

    const clearChildren = function (parent) {
        while (parent.firstChild) {
            parent.removeChild(parent.firstChild);
        }
    };

    const getElements = function (selector) {
        return document.querySelectorAll(selector);
    };

    const text = function (selector, txt) {
        [].forEach.call(getElements(selector), function (e) {
            e.textContent = txt;
        });
    };
</script>

<script type="text/javascript">
    var KLoad = {
        isGmod: navigator.userAgent.toLowerCase().indexOf('valve') !== -1,
        events: {},
        data: {
            demoMode: false,
            volume: 35,
            GameDetails: {},
            files: {
                downloaded: 0,
                needed: 1,
                total: 1,
                downloadComplete: false,
            },
        },
        finishedStatuses: [
            'Sending client info...',
            'Client info sent!',
            'Received all Lua files we needed!',
            'No files to request!',
            'Starting Lua...',
        ],
        tmp: {
            lastFileDownloaded: null,
        }
    };

    KLoad.emit = function (event) {
        if (typeof KLoad.events[event] !== 'undefined') {
            const args = [].slice.call(arguments);
            args.shift();
            KLoad.events[event].forEach(function (func) {
                func.apply(null, args);
            });
        }
    };

    KLoad.on = function (event, func) {
        if (typeof KLoad.events[event] === 'undefined') {
            KLoad.events[event] = [];
        }
        KLoad.events[event].push(func);
    };

    KLoad.on('GameDetails', function (servername, serverurl, mapname, maxplayers, steamid, gamemode, volume) {
        if (volume !== undefined && volume !== null) {
            KLoad.Music.setVolume(volume);
        }
    });

    KLoad.on('SetFilesTotal', function (total) {
        KLoad.data.files.total = total;
    });

    KLoad.on('SetFilesNeeded', function (needed) {
        KLoad.data.files.needed = needed;
    });

    KLoad.getProgress = function () {
        const progress = (KLoad.data.files.total > 0)
            ? (KLoad.data.files.total - KLoad.data.files.needed) / KLoad.data.files.total
            : (KLoad.data.files.downloaded / (KLoad.data.files.needed || 1));

        return {
            progress: KLoad.data.files.downloadComplete ? 1 : Math.max(0, Math.min(1, progress)),
            percentage: KLoad.data.files.downloadComplete ? 100 : Math.round(Math.max(0, Math.min(1, progress)) * 100)
        };
    };

    KLoad.on('DownloadingFile', function (file) {
        KLoad.data.files.downloaded++;
        KLoad.tmp.lastFileDownloaded = file;
        if (!KLoad.data.files.downloadComplete) {
            KLoad.emit('DownloadProgress', KLoad.getProgress());
        }
    });

    KLoad.on('DownloadProgress', function (data) {
        text('.percentage', data.percentage + '%');

        // Заполнение оранжевого круга снизу вверх
        var circle_inner = document.getElementById('load-circle-inner');
        if (circle_inner) {
            var polygon = 180;
            var imageclip = polygon - (data.progress * polygon);
            circle_inner.style.clip = "rect(" + imageclip + "px " + polygon + "px " + polygon + "px 0px)";
        }
    });

    KLoad.on('SetStatusChanged', function (status) {
        if (KLoad.finishedStatuses.indexOf(status) !== -1) {
            KLoad.data.files.downloadComplete = true;
            KLoad.emit('DownloadProgress', { progress: 1, percentage: 100 });
        }
    });

    KLoad.init = function () {
        window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode, volume) {
            KLoad.emit('GameDetails', servername, serverurl, mapname, maxplayers, steamid, gamemode, volume);
        };
        window.SetFilesTotal = function (total) {
            KLoad.emit('SetFilesTotal', total);
        };
        window.SetFilesNeeded = function (needed) {
            KLoad.emit('SetFilesNeeded', needed);
        };
        window.DownloadingFile = function (fileName) {
            KLoad.emit('DownloadingFile', fileName);
        };
        window.SetStatusChanged = function (status) {
            KLoad.emit('SetStatusChanged', status);
        };
    };

    // Применение настроек сервера
    if (window.serverInfo) {
        var tagEl = document.getElementById('player-tag');
        if (tagEl) {
            if (window.serverInfo.label) {
                tagEl.textContent = window.serverInfo.label;
                tagEl.style.display = 'block';
            } else {
                tagEl.style.display = 'none';
            }
        }
        var nameEl = document.getElementById('server-name');
        if (nameEl && window.serverInfo.serverName) {
            nameEl.textContent = window.serverInfo.serverName;
        }
    }

    // Ротация сообщений под сервером
    function onMessageContainers(callback) {
        [].forEach.call(document.querySelectorAll('.messages'), callback);
    }
    var message_counter = 0;
    if (window.messages && window.messages[message_counter]) {
        text('.messages', window.messages[message_counter].message);
        if (window.messages.length > 1) {
            setInterval(function () {
                message_counter++;
                if (message_counter >= window.messages.length) message_counter = 0;
                onMessageContainers(function (el) {
                    el.style.opacity = '0';
                    setTimeout(function () {
                        onMessageContainers(function (el) {
                            el.innerText = window.messages[message_counter].message;
                            el.style.opacity = '1';
                        });
                    }, 1000);
                });
            }, window.globalConfig.messages.duration + 500);
        }
    }

    // Менеджер фонов (Backgrounds)
    KLoad.Backgrounds = {
        init: function (backgrounds, options) {
            this.setBackgrounds(backgrounds);
            this.setOptions(options);
            this.setupCss();
            this.setupContainer();
            this.data = {
                currentIndex: -1,
                backgroundChildren: [],
                timer: null,
            };
            if (backgrounds && backgrounds.length) {
                this.start();
            }
            return this;
        },
        start: function () {
            var self = this;
            this.backgrounds.forEach(function (url) {
                self.container.appendChild(self.createBackground(url));
            });
            this.data.backgroundChildren = this.container.querySelectorAll('.bg-item');
            this.nextBackground();
            if (this.backgrounds.length > 1) {
                this.data.timer = setInterval(function () {
                    self.nextBackground();
                }, this.options.duration);
            }
        },
        nextBackground: function () {
            this.data.currentIndex++;
            if (this.data.currentIndex >= this.backgrounds.length) {
                this.data.currentIndex = 0;
            }
            const indx = this.data.currentIndex;
            for (let i = 0; i < this.data.backgroundChildren.length; i++) {
                this.data.backgroundChildren[i].style.opacity = (i === indx) ? '1' : '0';
            }
            return this;
        },
        setupContainer: function () {
            this.container = document.querySelector('.k-load-background-container');
            if (!this.container) {
                var div = document.createElement('div');
                div.className = 'k-load-background-container';
                document.body.appendChild(div);
                this.container = div;
            }
            return this;
        },
        setupCss: function () {
            var style = document.createElement('style');
            style.innerHTML = 'body > .k-load-background-container {z-index: -999999;pointer-events: none;position: fixed;top: 50%;left: 50%;width: 105%;height: 105%;-webkit-transform: translate(-50%, -50%);transform: translate(-50%, -50%);}' +
                '.k-load-background-container > .bg-item {z-index: -9998;position: absolute;inset: 0;width: 100%;height: 100%;background-size: cover;background-position: center;opacity: 0;-webkit-transition: opacity 1.2s ease-in-out;transition: opacity 1.2s ease-in-out;}';
            document.head.appendChild(style);
            return this;
        },
        setBackgrounds: function (backgrounds) {
            this.backgrounds = backgrounds || [];
            return this;
        },
        createBackground: function (imageUrl) {
            const div = document.createElement('div');
            div.className = 'bg-item';
            div.style.backgroundImage = 'url(' + imageUrl + ')';
            return div;
        },
        setOptions: function (options) {
            options = options || {};
            this.options = {
                fade: options.fade || 1000,
                duration: options.duration || 7000,
            };
            return this;
        }
    };

    /**
     * ========================================================
     * 🎵 МУЗЫКАЛЬНЫЙ МЕНЕДЖЕР: АВТОМАТИЧЕСКИЙ ПЕРЕХОД ТРЕКОВ
     * ========================================================
     */
    KLoad.Music = {
        audio: null,
        data: {
            currentIndex: 0,
            songs: [],
            isMuted: false,
            volume: 0.35
        },

        init: function (music, volume) {
            this.data.songs = music || [];
            this.data.volume = Math.max(0, Math.min(1, (volume || 35) / 100));
            this.setupAudio();

            if (this.data.songs.length) {
                this.start();
            }
            return this;
        },

        setupAudio: function () {
            var self = this;
            this.audio = document.getElementById('bg-music-player');
            if (!this.audio) {
                this.audio = document.createElement('audio');
                this.audio.id = 'bg-music-player';
                document.body.appendChild(this.audio);
            }

            this.audio.volume = this.data.volume;

            // 🎯 ГЛАВНОЕ: Автоматический переход к следующей песне, когда текущая закончилась!
            this.audio.addEventListener('ended', function () {
                console.log('Песня завершилась -> автоматическое переключение на следующий трек!');
                self.nextSong();
            });

            // Защита от ошибок в аудиофайле (автоматический переход дальше)
            this.audio.addEventListener('error', function (err) {
                console.warn('Ошибка воспроизведения аудиофайла, переход дальше...', err);
                setTimeout(function () {
                    self.nextSong();
                }, 800);
            });

            // Обновление тонкой полосы воспроизведения в виджете
            this.audio.addEventListener('timeupdate', function () {
                if (self.audio.duration && !isNaN(self.audio.duration)) {
                    var pct = (self.audio.currentTime / self.audio.duration) * 100;
                    var fill = document.getElementById('music-progress-fill');
                    if (fill) fill.style.width = pct + '%';
                }
            });
        },

        start: function () {
            var container = document.querySelector('.music-container');
            if (container) container.style.display = 'block';
            this.data.currentIndex = 0;
            this.playTrack(0);
        },

        nextSong: function () {
            if (!this.data.songs.length) return;
            var nextIdx = (this.data.currentIndex + 1) % this.data.songs.length;
            this.playTrack(nextIdx);
        },

        prevSong: function () {
            if (!this.data.songs.length) return;
            var prevIdx = (this.data.currentIndex - 1 + this.data.songs.length) % this.data.songs.length;
            this.playTrack(prevIdx);
        },

        playTrack: function (index) {
            if (!this.data.songs[index]) return;
            this.data.currentIndex = index;
            var song = this.data.songs[index];

            this.audio.src = song.url;
            this.audio.volume = this.data.volume;
            this.audio.muted = this.data.isMuted;

            // Обновление заголовка и счетчика
            var titleEl = document.getElementById('current-song-title');
            if (titleEl) titleEl.textContent = song.name;

            var counterEl = document.getElementById('music-counter');
            if (counterEl) counterEl.textContent = (index + 1) + '/' + this.data.songs.length;

            var fill = document.getElementById('music-progress-fill');
            if (fill) fill.style.width = '0%';

            var self = this;
            var playPromise = this.audio.play();
            if (playPromise !== undefined) {
                playPromise.then(function () {
                    var card = document.getElementById('music-card');
                    if (card && !self.data.isMuted) card.classList.add('playing');
                }).catch(function () {
                    var card = document.getElementById('music-card');
                    if (card) card.classList.remove('playing');

                    document.addEventListener('click', function unlockAudio() {
                        self.audio.play();
                        if (card && !self.data.isMuted) card.classList.add('playing');
                    }, { once: true });
                });
            }
        },

        setVolume: function (vol) {
            this.data.volume = Math.max(0, Math.min(1, (vol || 35) / 100));
            if (this.audio) this.audio.volume = this.data.volume;
            return this;
        },

        toggleMute: function () {
            this.data.isMuted = !this.data.isMuted;
            if (this.audio) this.audio.muted = this.data.isMuted;

            var card = document.getElementById('music-card');
            var btn = document.getElementById('music-mute-btn');
            if (this.data.isMuted) {
                if (card) card.classList.remove('playing');
                if (btn) btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
            } else {
                if (card) card.classList.add('playing');
                if (btn) btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
            }
        }
    };

    // Блок куратора Makar_mc09
    const staff_block = document.getElementById('k-load-staff');
    function setStaff() {
        if (!staff_block || !window.staff || !window.staff.length) return;
        clearChildren(staff_block);
        var staff_member = window.staff[0];
        var staffEl = elem('div', { className: 'k-load-staff' }, [
            elem('div', { className: 'k-load-staff-avatar' }, [
                elem('img', {
                    className: 'avatar',
                    src: staff_member.avatarfull || 'assets/avatars/makar.jpg'
                })
            ]),
            elem('div', { className: 'k-load-staff-info' }, [
                elem('span', { className: 'k-load-staff--name', innerText: staff_member.personaname }),
                elem('span', { className: 'k-load-staff--rank', innerText: staff_member.rank })
            ])
        ]);
        var block = elem('div', { className: 'k-load-staff-block active' }, [staffEl]);
        block.style.display = 'block';
        staff_block.appendChild(block);
    }

    // Инициализация
    setStaff();
    KLoad.init();

    if (window.backgrounds && window.backgrounds.length > 0) {
        KLoad.Backgrounds.init(window.backgrounds, window.globalConfig.backgrounds);
    }

    KLoad.Music.init(window.music, window.globalConfig.music.volume);

    // Установка начального прогресса 9%
    KLoad.emit('DownloadProgress', { progress: 0.09, percentage: 9 });

    // Управление музыкой кнопками в виджете
    document.getElementById('music-mute-btn').addEventListener('click', function () {
        KLoad.Music.toggleMute();
    });
    document.getElementById('music-prev-btn').addEventListener('click', function () {
        KLoad.Music.prevSong();
    });
    document.getElementById('music-next-btn').addEventListener('click', function () {
        KLoad.Music.nextSong();
    });

    // Горячие клавиши
    window.addEventListener('keydown', function (e) {
        if (e.key === 'm' || e.key === 'M' || e.key === 'ь' || e.key === 'Ь') {
            KLoad.Music.toggleMute();
        }
        if (e.key === 'n' || e.key === 'N' || e.key === 'т' || e.key === 'Т') {
            KLoad.Music.nextSong();
        }
        if (e.key === 'h' || e.key === 'H' || e.key === 'р' || e.key === 'Р') {
            var bar = document.getElementById('demo-bar');
            if (bar) bar.classList.toggle('hidden');
        }
        if (e.key === 'b' || e.key === 'B' || e.key === 'и' || e.key === 'И') {
            KLoad.Backgrounds.nextBackground();
        }
    });

    // Панель тестирования в обычном браузере
    var demoTimer = null;
    document.getElementById('btn-demo-start').addEventListener('click', function () {
        if (demoTimer) {
            clearInterval(demoTimer);
            demoTimer = null;
            this.textContent = '▶ Запуск';
            return;
        }
        this.textContent = '⏸ Пауза';
        var pct = 0;
        demoTimer = setInterval(function () {
            pct++;
            KLoad.emit('DownloadProgress', { progress: pct / 100, percentage: pct });
            if (pct >= 100) {
                clearInterval(demoTimer);
                demoTimer = null;
                document.getElementById('btn-demo-start').textContent = '▶ Запуск';
            }
        }, 100);
    });

    // Кнопка для быстрой проверки автопереключения трека: перематывает на конец песни
    document.getElementById('btn-demo-end-song').addEventListener('click', function () {
        if (KLoad.Music.audio && KLoad.Music.audio.duration) {
            KLoad.Music.audio.currentTime = Math.max(0, KLoad.Music.audio.duration - 1.5);
        }
    });

    document.getElementById('btn-demo-9').addEventListener('click', function () {
        if (demoTimer) clearInterval(demoTimer);
        KLoad.emit('DownloadProgress', { progress: 0.09, percentage: 9 });
    });
    document.getElementById('btn-demo-50').addEventListener('click', function () {
        if (demoTimer) clearInterval(demoTimer);
        KLoad.emit('DownloadProgress', { progress: 0.50, percentage: 50 });
    });
    document.getElementById('btn-demo-100').addEventListener('click', function () {
        if (demoTimer) clearInterval(demoTimer);
        KLoad.emit('DownloadProgress', { progress: 1.0, percentage: 100 });
    });
    document.getElementById('btn-demo-bg').addEventListener('click', function () {
        KLoad.Backgrounds.nextBackground();
    });

    // Если открыто внутри Garry's Mod — скрываем панель теста
    if (KLoad.isGmod) {
        var bar = document.getElementById('demo-bar');
        if (bar) bar.style.display = 'none';
    }
</script>
</body>
</html>
